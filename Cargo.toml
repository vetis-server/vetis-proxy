[package]
name = "vetis-proxy"
version = "0.1.2-beta.1"
edition = "2024"
authors = ["Rogerio Araújo <rogerio.araujo@gmail.com>"]
repository = "https://github.com/vetis-server/vetis-proxy"
homepage = "https://github.com/vetis-server/vetis"
description = "Very Tiny Server Proxy support"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["http", "modules", "server", "rest-server"]
publish = true
rust-version = "1.85.0"

[features]
default = ["runtime-tokio"]
runtime-tokio = [
  "deboa-tokio/rust-tls",
  "deboa-tokio/default-rustls-provider",
  "deboa-tokio/default-rustls-verifier",
  "vetis-tokio/rust-tls",
]

[dependencies]
deboa = { version = "0.1.5-beta.7" }
deboa-tokio = { version = "0.1.4-beta.8", optional = true }
serde = { version = "1.0.228", features = ["derive"] }
typetag = "0.2.21"
vetis = { version = "0.1.7-beta.6" }
vetis-tokio = { version = "0.1.2-beta.8" }

[dev-dependencies]
caramelo = "0.1.5"
tokio = { version = "1.53.1", default-features = false, features = ["macros"] }
