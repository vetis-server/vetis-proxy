[package]
name = "vetis-proxy"
version = "0.1.2-beta.1"
edition = "2024"
authors = ["Rogerio Araújo <rogerio.araujo@gmail.com>"]
repository = "https://github.com/vetis-server/vetis-proxy"
homepage = "https://github.com/vetis-server/vetis"
description = "Very Tiny Server Proxy support"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["http", "modules", "server", "rest-server"]
publish = true
rust-version = "1.86.0"

[features]
default = ["runtime-tokio"]
runtime-tokio = []

[dependencies]
cel = "0.16.0"
compact_str = "0.10.0"
# deboa = { version = "0.1.5" }
# deboa-tokio = { version = "0.1.4", optional = true }
serde = { version = "1.0.228", features = ["derive", "rc"] }
typetag = "0.2.21"
vetis = { path = "../vetis/vetis" }
# vetis-tokio = { path = "../vetis-tokio" }

[dev-dependencies]
caramelo = "0.1.5"
tokio = { version = "1.54.1", default-features = false, features = ["macros"] }

# [patch.crates-io]
# vetis = { path = "../vetis/vetis" }
# vetis-tokio = { path = "../vetis-tokio" }
